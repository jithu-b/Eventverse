    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var currentFetch = origFetch ? origFetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore if already configured
        }
      })();
    </script>
